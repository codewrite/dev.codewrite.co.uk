baseURL = 'https://dev.codewrite.co.uk/'
locale = 'en-us'
title = 'Codewrite Dev Doc'
theme = 'hugo-book'
pygmentsStyle = "github"
enableEmoji = true

[params]
  BookToC = true
  BookSection = '/'
  math = true

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    linenos = true